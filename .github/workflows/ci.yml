# Builds the iOS app with the newest Xcode on GitHub's macOS runners and runs the LodestarKit tests.
# No signing: this verifies that everything compiles; Xcode Cloud produces the signed builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test LodestarKit
        run: swift test --package-path LodestarKit

      - name: Build app for the iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app for iOS devices (Release, unsigned)
        run: |
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
