# Builds the iOS app with the newest Xcode on GitHub's macOS runners and runs the LodestarKit tests.
# The Lodestar scheme also builds what the app embeds: the widget extension (LodestarWidgets) and the Apple Watch
# app (LodestarWatch) with its complications (LodestarWatchWidgets); a step checks that all three end up in the app.
# No signing: this verifies that everything compiles; Xcode Cloud produces the signed builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test LodestarKit
        run: swift test --package-path LodestarKit

      - name: List the project's targets and the installed SDKs
        run: |
          xcodebuild -list -project Lodestar.xcodeproj
          xcodebuild -showsdks

      - name: Build app for the iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build app for iOS devices (Release, unsigned)
        run: |
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the widgets and the watch app are embedded (Simulator build)
        run: bash Tools/check-embedded-products.sh Debug-iphonesimulator

      - name: Check the widgets and the watch app are embedded (device build)
        run: bash Tools/check-embedded-products.sh Release-iphoneos

  # The committed Lodestar.xcodeproj is what is built above.  This job only checks that the XcodeGen fallback
  # (project.yml) still generates a project with the same targets and embeds; it is informational.
  xcodegen-spec:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project from project.yml
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml --project "$RUNNER_TEMP/spec"
          xcodebuild -list -project "$RUNNER_TEMP/spec/Lodestar.xcodeproj"
          for phase in "Embed Watch Content" "Embed Foundation Extensions"; do
            grep -q "$phase" "$RUNNER_TEMP/spec/Lodestar.xcodeproj/project.pbxproj" \
              || { echo "missing build phase: $phase"; exit 1; }
          done
