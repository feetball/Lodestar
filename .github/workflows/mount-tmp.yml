# TEMPORARY: app-only build for iterating on features-1.1-mount-ios. Deleted before the branch is finished.
name: Mount app build (temporary)

on:
  push:
    branches: [features-1.1-mount-ios]

permissions:
  contents: read

concurrency:
  group: mount-tmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version

      - name: Build app for the iOS Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-debug.log | grep -E "error:|warning:" | sort -u || true
          grep -q "BUILD SUCCEEDED" build-debug.log

      - name: Build app for iOS devices (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lodestar.xcodeproj \
            -scheme Lodestar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-release.log | grep -E "error:|warning:" | sort -u || true
          grep -q "BUILD SUCCEEDED" build-release.log
