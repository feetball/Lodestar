# Temporary: runs on pushes to debug-* branches only. Never merge this file.
name: Debug

on:
  push:
    branches: ['debug-*']

permissions:
  contents: read

jobs:
  coverage:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          sudo xcode-select --switch "$XCODE"
      - name: Test LodestarKit with coverage
        run: swift test --package-path LodestarKit --enable-code-coverage --skip CometsOrbitTests/testSolverIsFast 2>&1 | grep -E "error:|Executed [0-9]+ tests, with [0-9]+ failures" | tail -8 || true
      - name: Coverage report (from the raw profile, so that failing tests do not matter)
        run: |
          BIN="LodestarKit/.build/arm64-apple-macosx/debug/LodestarKitPackageTests.xctest/Contents/MacOS/LodestarKitPackageTests"
          ls -la "$BIN"
          find LodestarKit/.build -name '*.profraw' | head -5
          PROF="$RUNNER_TEMP/merged.profdata"
          xcrun llvm-profdata merge -sparse $(find LodestarKit/.build -name '*.profraw') -o "$PROF"
          xcrun llvm-cov export -summary-only -instr-profile "$PROF" "$BIN" > kit-coverage.json
          python3 Tools/coverage_report.py kit-coverage.json LodestarKit/Sources/ | tee coverage-kit.md
          cat coverage-kit.md >> "$GITHUB_STEP_SUMMARY"
