# XcodeGen spec for Lodestar.
#
# The committed Lodestar.xcodeproj is the primary project (hand-written, Xcode 16+ format with a
# synchronized "Lodestar" folder).  This spec is the fallback: if the project file is ever damaged,
# `xcodegen generate` rebuilds an equivalent one.  Keep both in sync when changing settings.
#
# The widget extension (LodestarWidgets), the watch app (LodestarWatch) and the watch complications
# (LodestarWatchWidgets) are part of both descriptions; WidgetShared is compiled into all three.  Their versions
# (MARKETING_VERSION / CURRENT_PROJECT_VERSION) must equal the app's: change all four targets together.
#
# Verified with XcodeGen 2.46.0.  Synchronized folders (`type: syncedFolder`) and `projectFormat`
# need XcodeGen 2.45.0 or newer.  XcodeGen refuses to run while README.md or ATTRIBUTION.md is
# missing (they are listed under `fileGroups`).  The generated project differs from the committed one
# only cosmetically: it adds a "Packages" group that points at LodestarKit and XcodeGen's legacy
# CODE_SIGN_IDENTITY / CLANG_CXX_LIBRARY / SWIFT_OPTIMIZATION_LEVEL defaults; every setting listed
# below resolves to the same value.

name: Lodestar

options:
  minimumXcodeGenVersion: 2.45.0
  projectFormat: xcode16_0
  xcodeVersion: "1600"
  developmentLanguage: en
  bundleIdPrefix: net.kuecker
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

# Files that belong to the project but to no target.  Config/Info.plist is deliberately outside the
# synchronized "Lodestar" folder so it is never copied into the app bundle as a resource.
fileGroups:
  - Config/Info.plist
  - Config/Widgets-Info.plist
  - Config/Watch-Info.plist
  - Config/WatchWidgets-Info.plist
  - README.md
  - ATTRIBUTION.md

packages:
  LodestarKit:
    path: LodestarKit

# Project-level settings.  XcodeGen's presets already provide Xcode's standard warning flags; these
# entries align the remaining defaults with what Xcode 16 writes for a new iOS App project.
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SDKROOT: iphoneos
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
    Release:
      VALIDATE_PRODUCT: "YES"

targets:
  Lodestar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    attributes:
      CreatedOnToolsVersion: "16.0"
    sources:
      - path: Lodestar
        type: syncedFolder
    dependencies:
      - package: LodestarKit
      - target: LodestarWidgets
      - target: LodestarWatch
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: "YES"
        DEVELOPMENT_TEAM: 39489Q7GDR
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lodestar
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSCameraUsageDescription: >-
          Lodestar shows the live camera view behind its sky overlay so you can line up your
          tripod. Video is processed on your iPhone only and is never recorded, stored, or shared.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Lodestar uses your location on this iPhone to work out where stars and planets appear in
          your sky and to find true north. It is never collected or tracked.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: magnetometer gyroscope accelerometer
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: net.kuecker.Lodestar
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # Home Screen and Lock Screen widgets.  The location comes from Core Location inside the extension
  # (NSWidgetWantsLocation in Config/Widgets-Info.plist); there is no App Group.
  LodestarWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    attributes:
      CreatedOnToolsVersion: "16.0"
    sources:
      - path: LodestarWidgets
        type: syncedFolder
      - path: WidgetShared
        type: syncedFolder
    dependencies:
      - package: LodestarKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: "YES"
        DEVELOPMENT_TEAM: 39489Q7GDR
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Widgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lodestar
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: net.kuecker.Lodestar.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: iphoneos
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # The Apple Watch app (a single-target watchOS 10 app embedded in the iPhone app).
  LodestarWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    attributes:
      CreatedOnToolsVersion: "16.0"
    sources:
      - path: LodestarWatch
        type: syncedFolder
      - path: WidgetShared
        type: syncedFolder
    dependencies:
      - package: LodestarKit
      - target: LodestarWatchWidgets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: "YES"
        DEVELOPMENT_TEAM: 39489Q7GDR
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/Watch-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lodestar
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: net.kuecker.Lodestar.watchkitapp
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: watchos
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: watchos watchsimulator
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  # The watch complications (Smart Stack and watch faces).
  LodestarWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    attributes:
      CreatedOnToolsVersion: "16.0"
    sources:
      - path: LodestarWatchWidgets
        type: syncedFolder
      - path: WidgetShared
        type: syncedFolder
    dependencies:
      - package: LodestarKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: "YES"
        DEVELOPMENT_TEAM: 39489Q7GDR
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Config/WatchWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lodestar
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: net.kuecker.Lodestar.watchkitapp.Widgets
        PRODUCT_NAME: $(TARGET_NAME)
        SDKROOT: watchos
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  Lodestar:
    build:
      targets:
        Lodestar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LodestarKit/LodestarKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
